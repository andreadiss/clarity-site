<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Clarity | People Analytics Services</title>
  <meta name="description" content="Quantitative and qualitative research services that turn people data into clear, evidence-based decisions.">
  <link rel="canonical" href="https://claritylab.cloud/">
  <link rel="alternate" hreflang="en" href="https://claritylab.cloud/en/">
  <link rel="alternate" hreflang="it" href="https://claritylab.cloud/it/">
  <link rel="alternate" hreflang="x-default" href="https://claritylab.cloud/en/">
  <script>
    const lang = navigator.language || navigator.userLanguage;
    const lowerLang = lang.toLowerCase();
    if (lowerLang.startsWith("it")) {
      window.location.replace("it/index.html");
    } else {
      window.location.replace("en/index.html");
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <main>
    <p>Choose your language: <a href="en/" lang="en">English</a> · <a href="it/" lang="it">Italiano</a></p>
    <noscript><p>JavaScript is disabled, so automatic language selection is unavailable.</p></noscript>
  </main>
</body>
</html>
